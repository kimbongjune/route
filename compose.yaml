# docker compose up                       내비 API, PostGIS, GeoServer
# docker compose run --rm importer        그래프 파일과 CCH 생성(배치, 실행 후 종료)
# docker compose run --rm importer importer-geocode   지오코더 색인 생성
# docker compose run --rm importer importer-alley     골목 파일 생성(그래프 파일 다음에 실행)
# docker compose run --rm loader [시도 폴더명...]      전자지도를 PostGIS에 적재(없으면 전국)
services:
  api:
    build:
      context: .
      target: api
    image: route-nav-api
    ports:
      - "3000:3000"
    volumes:
      - ./maps:/maps:ro
    env_file:
      - .env
    environment:
      ROUTE_MAPS_DIR: /maps
      NAV_ADDR: 0.0.0.0:3000
      GEOSERVER_URL: http://geoserver:8080/geoserver
    deploy:
      resources:
        limits:
          memory: 4g
    restart: unless-stopped

  importer:
    build:
      context: .
      target: importer
    image: route-importer-knl
    profiles:
      - import
    volumes:
      - ./maps:/maps
    environment:
      ROUTE_MAPS_DIR: /maps

  # 전자지도 적재 대상. 데이터는 볼륨 pgdata에 남는다
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: route
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: route
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    shm_size: 1g
    restart: unless-stopped

  # 벡터 타일 발행과 GeoWebCache. 이미지가 vectortiles 플러그인을 기동 시 설치한다
  geoserver:
    image: kartoza/geoserver:2.28.2
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      GEOSERVER_DATA_DIR: /opt/geoserver/data_dir
      GEOWEBCACHE_CACHE_DIR: /opt/geoserver/data_dir/gwc
      INITIAL_MEMORY: 1G
      MAXIMUM_MEMORY: 4G
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - postgis
    restart: unless-stopped

  # GDAL ogr2ogr로 전자지도 shp를 PostGIS에 넣는 배치
  loader:
    image: ghcr.io/osgeo/gdal:ubuntu-small-3.12.4
    profiles:
      - import
    volumes:
      - ./maps:/maps:ro
      - ./scripts/tiles:/work:ro
    environment:
      PGHOST: postgis
      PGUSER: route
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: route
    entrypoint: ["bash", "/work/load_emap.sh"]
    depends_on:
      - postgis

volumes:
  pgdata:
  geoserver_data:
