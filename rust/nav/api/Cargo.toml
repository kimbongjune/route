[package]
name = "nav-api"
version = "0.1.0"
edition.workspace = true

[dependencies]
axum = "0.8.9"
csv = "1.4.0"
geo = "0.33.1"
reqwest = { version = "0.13.5", features = ["json", "query"] }
routedb-core = { path = "../../routedb/core" }
rstar = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
